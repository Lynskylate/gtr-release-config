apiVersion: deploy.lynskylate/v1alpha1
kind: DeploymentStack
service_name: corp-finance-monitor
target_group: gtr-core
runtime:
  type: rootless-podman
  network:
    name: corp-finance-monitor
service_user: svc-corp-finance-monitor
exposure: tailscale
healthcheck:
  url: http://127.0.0.1:8190/healthz
  expect_status: 200
  timeout_seconds: 60
managed_files:
- path: /srv/projects/corp-finance-monitor/config/config.yaml
  mode: '0644'
  content: "engine:\n  run_once: false\n  interval_minutes: 360\n  concurrency: 1\n\
    \  fetch_delay_seconds: 0.5\nstorage:\n  backend: disk\n  base_dir: ./data\nstate_store:\n\
    \  backend: sqlite\n  path: ./data/.cfm_state/state.db\napi:\n  enabled: true\n\
    \  host: 127.0.0.1\n  port: 8190\nscheduling:\n  tiers:\n    - name: core\n  \
    \    stocks: [\"000725\", \"600519\", \"000858\"]\n      interval_minutes: 60\n\
    \    - name: full\n      interval_minutes: 720\n      use_registry: true\n  disclosure_windows:\n\
    \    - months: [1, 2, 3, 4]\n      multiplier: 0.5\n    - months: [7, 8]\n   \
    \   multiplier: 0.5\nsources:\n  cninfo:\n    options:\n      full_market: true\n\
    \      full_market_batch_size: 50\n    watchlist:\n      - stock: \"000725\"\n\
    \        org_id: \"gssz0000725\"\n        kinds: [annual, semi, q1, q3]\n    \
    \  - stock: \"600519\"\n        org_id: \"gssh0600519\"\n        kinds: [annual,\
    \ semi, q1, q3]\n      - stock: \"000858\"\n        org_id: \"gssz0000858\"\n\
    \        kinds: [annual, semi, q1, q3]\n  sse:\n    watchlist: []\n  hkex:\n \
    \   watchlist:\n      - stock: \"00700\"\n        kinds: [annual, interim]\n \
    \     - stock: \"09988\"\n        kinds: [annual, interim]\n"
