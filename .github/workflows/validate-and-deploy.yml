name: Validate And Deploy

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      service:
        description: Stack name to deploy
        required: false
        default: corp-finance-monitor
      environment:
        description: Target environment
        required: false
        default: prod
      dry_run:
        description: Run deployctl in dry-run mode
        required: false
        default: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository manifests
        run: python scripts/validate_repo.py

  plan-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Collect changed stack files
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git ls-files 'environments/*/stacks/*.yaml' > changed-stacks.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-stacks.txt
          fi
      - name: Build deployment matrix
        id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/release_matrix.py \
              --service "${{ inputs.service }}" \
              --environment "${{ inputs.environment }}" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_matrix.py \
              --changed-file-list changed-stacks.txt \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Package deployment bundle
        id: bundle
        shell: bash
        run: |
          bundle_path="$RUNNER_TEMP/deployment-bundle.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            -czf "$bundle_path" \
            .
          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  stage-images:
    if: needs.plan-deploy.outputs.has_changes == 'true'
    needs: plan-deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-deploy.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Stage deployment images
        env:
          DEPLOYCTL_GHCR_USERNAME: ${{ github.repository_owner }}
          DEPLOYCTL_GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_READ_TOKEN || github.token }}
        shell: bash
        run: |
          archive_dir="$RUNNER_TEMP/image-archives/${{ matrix.environment }}-${{ matrix.service }}"
          mkdir -p "$archive_dir"
          python tools/deployctl.py stage-images "${{ matrix.service }}" "${{ matrix.environment }}" --archive-dir "$archive_dir"
      - name: Upload image archives
        uses: actions/upload-artifact@v4
        with:
          name: image-archives-${{ matrix.environment }}-${{ matrix.service }}
          path: ${{ runner.temp }}/image-archives/${{ matrix.environment }}-${{ matrix.service }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: needs.plan-deploy.outputs.has_changes == 'true'
    needs: [plan-deploy, stage-images]
    runs-on: [self-hosted, linux, x64, tencent, gtr-release-config]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-deploy.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-bundle
      - name: Unpack deployment bundle
        shell: bash
        run: |
          tar -xzf deployment-bundle.tar.gz
          rm deployment-bundle.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: image-archives-${{ matrix.environment }}-${{ matrix.service }}
          path: image-archives
      - name: Verify runner Python runtime
        run: |
          python3 --version
          python3 -c "import yaml; print(yaml.__version__)"
      - name: Run deployctl
        env:
          DEPLOYCTL_GHCR_USERNAME: ${{ github.repository_owner }}
          DEPLOYCTL_GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_READ_TOKEN || github.token }}
        shell: bash
        run: |
          extra_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            extra_args+=(--dry-run)
          fi
          extra_args+=(--image-archive-dir "$PWD/image-archives")
          PYTHONPATH=. python3 tools/deployctl.py apply "${{ matrix.service }}" "${{ matrix.environment }}" "${extra_args[@]}"
