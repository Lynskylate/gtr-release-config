name: Validate And Deploy

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      service:
        description: Stack name to deploy
        required: false
        default: corp-finance-monitor
      environment:
        description: Target environment
        required: false
        default: prod
      dry_run:
        description: Run deployctl in dry-run mode
        required: false
        default: "true"

env:
  GTR_TAILSCALE_IP: "100.121.0.67"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository manifests
        run: python scripts/validate_repo.py

  plan-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Collect changed stack files
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git ls-files 'environments/*/stacks/*.yaml' > changed-stacks.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-stacks.txt
          fi
      - name: Build deployment matrix
        id: matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/release_matrix.py \
              --service "${{ inputs.service }}" \
              --environment "${{ inputs.environment }}" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/release_matrix.py \
              --changed-file-list changed-stacks.txt \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Package deployment bundle
        id: bundle
        shell: bash
        run: |
          bundle_path="$RUNNER_TEMP/deployment-bundle.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            -czf "$bundle_path" \
            .
          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: needs.plan-deploy.outputs.has_changes == 'true'
    needs: plan-deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-deploy.outputs.matrix) }}
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Diagnose Tailscale status
        run: |
          echo "=== Tailscale status ==="
          tailscale status
          echo ""
          echo "=== Self info ==="
          tailscale status --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          s = d.get('Self', {})
          print('HostName:', s.get('HostName'))
          print('IPs:', s.get('TailscaleIPs'))
          print('Tags:', s.get('Tags'))
          print('Online:', s.get('Online'))
          # Find GTR in peers
          for nid, p in d.get('Peer', {}).items():
              if 'gtr' in p.get('HostName', '').lower():
                  print()
                  print('=== GTR peer ===')
                  print('HostName:', p.get('HostName'))
                  print('IPs:', p.get('TailscaleIPs'))
                  print('Tags:', p.get('Tags'))
                  print('Online:', p.get('Online'))
                  print('Active:', p.get('Active'))
          "

      - name: Setup SSH
        run: |
          echo "${{ env.GTR_TAILSCALE_IP }} gtr gtr.tail414c32.ts.net" | sudo tee -a /etc/hosts
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<'SSHCFG'
          Host *
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCFG

      - name: Test SSH connectivity to GTR
        run: |
          echo "=== Ping GTR ==="
          ping -c 2 -W 5 ${{ env.GTR_TAILSCALE_IP }} || echo "Ping failed (non-fatal)"
          echo "=== SSH to GTR ==="
          ssh -o ConnectTimeout=10 root@gtr.tail414c32.ts.net "hostname && uptime"

      - uses: actions/download-artifact@v4
        with:
          name: deployment-bundle
      - name: Unpack deployment bundle
        shell: bash
        run: |
          tar -xzf deployment-bundle.tar.gz
          rm deployment-bundle.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Verify runner Python runtime
        run: |
          python3 --version
          python3 -c "import yaml; print(yaml.__version__)"
      - name: Run deployctl
        env:
          DEPLOYCTL_REGISTRY: ccr.ccs.tencentyun.com
          DEPLOYCTL_REGISTRY_USERNAME: ${{ secrets.TCR_USERNAME }}
          DEPLOYCTL_REGISTRY_TOKEN: ${{ secrets.TCR_PASSWORD }}
        shell: bash
        run: |
          extra_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            extra_args+=(--dry-run)
          fi
          PYTHONPATH=. python3 tools/deployctl.py apply "${{ matrix.service }}" "${{ matrix.environment }}" "${extra_args[@]}"
